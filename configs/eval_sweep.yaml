# Softmax-noise sweep. Every base point runs with rho_noise_bound = 0
# (enforced by _config_for_spec and recorded here explicitly) so each accuracy
# delta is attributable to the logit-noise knobs alone. The deployment-fold
# rho = 1e-5 belongs to separate replica runs selected from the sweep
# candidates (option 丙 follow-up); it is never inherited from the base
# config. Archived results/raw/eval_sweep*.jsonl predate this policy and are
# not pointwise comparable to reruns.
base_config: configs/tiny_approx.yaml
experiment:
  name: required-softmax-noise-sweep
  seed: 20260731
  model_id: fastprove-random-tiny-correctness-only
  dataset_id: deterministic-synthetic-token-sequences
  source_revision: revision_unavailable
  output_jsonl: results/raw/eval_sweep.jsonl
  cached_inputs: results/raw/eval_inputs.pt
  calibration_sample_count: 8
  full_sample_count: 64
  selection_rule: >-
    Retain every required point in raw output. If a later full pretrained run is
    resource constrained, calibrate all points first and select the Pareto frontier
    plus tau endpoints; record non-selected points explicitly as calibration_only.
evaluation_override:
  sequence_length: 24
  generation_tokens: 4
  warmup_runs: 3
  timed_runs: 10
  bootstrap_replicates: 1000
evaluation_notes: >-
  Length 24 provides at least k+1 valid logits for later causal positions when
  preserve_top_k is 16. Earlier rows with valid_count <= k deliberately receive
  zero Top-k-preserving noise and are counted by the zero-noise metric.
obfuscation_override:
  # Base-sweep contract: no bounded RMS-scale noise. Replica runs override
  # this value explicitly instead of relying on the base config.
  rho_noise_bound: 0.0
sweep:
  modes:
    - plaintext
    - exact
    - topk_preserving
    - free_bounded
  tau_max:
    - 0.0
    - 0.001
    - 0.003
    - 0.01
    - 0.03
    - 0.05
    - 0.10
  alpha:
    - 0.50
    - 0.80
    - 0.95
  preserve_top_k:
    - 4
    - 8
    - 16
  tau_error: 0.10
execution:
  # The 72/72 base sweep completed on 2026-09-19. Any rerun still requires the
  # explicit --execute-deferred authorization and follows the rho=0 contract
  # above (results are not pointwise comparable to the archived jsonl).
  run_in_current_prototype_pass: true
  reason: base_sweep_completed_2026_09_19_reruns_require_explicit_authorization
