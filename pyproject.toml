[build-system]
requires = ["setuptools>=58"]
build-backend = "setuptools.build_meta"

[project]
name = "fastprove"
version = "0.1.0"
description = "Reference prototype for augmented covariant Transformer obfuscation"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "torch>=2.8",
  "numpy>=2.0",
  "PyYAML>=6.0",
  "matplotlib>=3.9",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]
pretrained-lite = [
  "transformers>=4.57",
  "safetensors>=0.7",
]
pretrained = [
  "transformers>=4.57",
  "datasets>=4.0",
  "safetensors>=0.7",
]

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["fastprove*", "evals*"]

[tool.setuptools.package-data]
evals = ["configs/*.yaml"]

[tool.pytest.ini_options]
pythonpath = [".", "src"]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "slow: wall-clock-heavy test (label only; never skipped by default)",
  "subprocess: spawns a CLI subprocess (label only; never skipped by default)",
  "mps: exercises the Apple MPS backend (label only; existing skip guards unchanged)",
  "bf16: exercises bfloat16 kernels (label only; never skipped by default)",
  "safetensors: exercises safetensors checkpoint IO (label only; never skipped by default)",
]
